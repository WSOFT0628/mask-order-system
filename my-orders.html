<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>查詢我的口罩訂單</title><style>
:root{--brand:#0f766e;--ink:#20313a;--muted:#718087;--line:#dce8e5;--bg:#f3f7f6;--danger:#be123c;--shadow:0 12px 35px rgba(25,72,67,.10)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input{font:inherit}.top{background:white;border-bottom:1px solid var(--line)}.topin{max-width:900px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:11px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#14b8a6,var(--brand));display:grid;place-items:center;color:white;font-size:21px}.top h1{font-size:18px;margin:0}.top a{margin-left:auto;color:var(--brand);text-decoration:none;font-weight:800}.wrap{max-width:900px;margin:auto;padding:20px 14px 100px}.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:19px;margin-bottom:14px;box-shadow:0 5px 18px rgba(25,72,67,.05)}h2,h3{margin:0 0 11px}.sub,.mini{color:var(--muted);font-size:12px}.form{display:grid;grid-template-columns:1fr 1fr auto;gap:11px;align-items:end}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:4px}.field input{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:white}.btn{border:0;border-radius:11px;padding:11px 15px;background:#e5f4f1;color:var(--brand);font-weight:800;cursor:pointer}.btn.primary{background:var(--brand);color:white}.btn.danger{background:#fff1f2;color:var(--danger)}.notice{border-radius:12px;padding:11px 13px;background:#fff7ed;color:#9a5308;margin-top:12px}.hidden{display:none!important}.head{display:flex;justify-content:space-between;gap:12px;align-items:start}.status{border-radius:99px;padding:5px 10px;background:#e5f4f1;color:var(--brand);font-size:12px}.items{display:grid;gap:7px;background:#f5f9f8;border-radius:12px;padding:12px;margin:13px 0}.item{display:grid;grid-template-columns:1fr auto auto;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:7px}.item:last-child{border:0;padding:0}.summary{border-top:1px solid var(--line);padding-top:9px}.sum{display:flex;justify-content:space-between;padding:5px 0}.grand{font-size:19px;font-weight:850;color:var(--brand)}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:13px}.side{position:fixed;right:14px;bottom:25px;display:grid;gap:8px}.side button{width:44px;height:44px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--brand);font-size:20px;box-shadow:var(--shadow)}.toast{position:fixed;right:14px;top:72px;background:#173d39;color:white;padding:12px 14px;border-radius:12px;box-shadow:var(--shadow)}@media(max-width:650px){.form{grid-template-columns:1fr}.item{grid-template-columns:1fr auto}.item b:last-child{grid-column:2}.head{flex-direction:column}}
</style></head><body><header class="top"><div class="topin"><div class="logo">✦</div><div><h1>我的口罩訂單</h1><div class="sub">買家個人查詢</div></div><a href="order.html">返回訂購</a></div></header><main class="wrap"><section class="panel"><h2>查詢訂單</h2><p class="sub">此頁不隸屬任何月份活動。活動結束後，仍可查看當時的商品與訂單紀錄。</p><div class="form"><div class="field"><label>訂單編號</label><input id="orderNo" autocomplete="off" placeholder="例如：M260815-ABC"></div><div class="field"><label>訂購時填寫的完整電話</label><input id="phone" inputmode="tel" autocomplete="tel"></div><button class="btn primary" id="search">查詢</button></div><div class="notice">為保護資料，訂單編號與完整電話必須同時正確；不會顯示其他買家的訂單。</div></section><section class="panel hidden" id="result"><div class="head"><div><h2 id="resultTitle"></h2><div class="mini" id="resultMeta"></div></div><span class="status" id="resultStatus"></span></div><div class="items" id="items"></div><div id="customer"></div><div class="summary"><div class="sum"><span>商品總數量</span><b id="qty"></b></div><div class="sum grand"><span>總金額</span><b id="total"></b></div></div><div class="notice hidden" id="lockedNote"></div><div class="actions"><button class="btn primary" id="modify">修改訂單</button><button class="btn danger" id="cancel">取消訂單</button><button class="btn" id="clear">查詢另一筆</button></div></section></main><div class="side"><button id="top">↑</button><button id="bottom">↓</button></div><script>
const API='https://jhyxaalondrfcybpsgdk.supabase.co/functions/v1/mask-public-order',KEY='sb_publishable_ssZRWVeK1ErlUpKisHgmPg_ZD7iEXzM',$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW');let current=null,currentPhone='';
async function api(body){let r=await fetch(API,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'REQUEST_FAILED');return d}
function toast(t){let n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(()=>n.remove(),3800)}
const names={pending:'待確認',confirmed:'已確認',contact:'需聯絡',aggregated:'已彙整',cancelled:'已取消',completed:'已完成'};
function render(d){current=d;let o=d.order,items=o.items||[],qty=items.reduce((n,x)=>n+Number(x.qty||0),0),subtotal=items.reduce((n,x)=>n+Number(x.line_total??Number(x.price||0)*Number(x.qty||0)),0),total=subtotal+Number(o.shipping||0)+Number(o.tax||0),locked=!d.campaign.allow_edit||!d.campaign.active||['aggregated','completed','cancelled'].includes(o.status);$('#resultTitle').textContent=o.order_no;$('#resultMeta').textContent=`${d.campaign.name}｜下單日期 ${new Date(o.created_at).toLocaleString('zh-TW')}`;$('#resultStatus').textContent=names[o.status]||o.status;$('#items').innerHTML=items.map(x=>`<div class="item"><span>${esc(x.name)}｜${esc(x.variant)}</span><b>${x.qty} 盒</b><b>${money(x.line_total??x.price*x.qty)}</b></div>`).join('');$('#customer').innerHTML=`<b>訂購人：</b>${esc(o.customer?.name)}　<b>電話：</b>${esc(o.customer?.phone)}${o.customer?.note?`<br><b>備註：</b>${esc(o.customer.note)}`:''}`;$('#qty').textContent=qty+' 盒';$('#total').textContent=money(total);$('#modify').classList.toggle('hidden',locked);$('#cancel').classList.toggle('hidden',locked);$('#lockedNote').classList.toggle('hidden',!locked);$('#lockedNote').textContent=locked?'活動已截止、訂單已彙整或目前狀態不可修改；歷史內容仍可查看。':'';$('#result').classList.remove('hidden');$('#result').scrollIntoView({behavior:'smooth'})}
async function search(){let no=$('#orderNo').value.trim().toUpperCase(),phone=$('#phone').value.trim();if(!no||!phone)return toast('請輸入訂單編號與完整電話。');try{$('#search').disabled=true;let d=await api({action:'lookup',order_no:no,lookup_phone:phone});currentPhone=phone;render(d)}catch(e){toast(e.message==='INVALID_ORDER_ACCESS'?'訂單編號或電話不正確。':'查詢失敗，請稍後再試。')}finally{$('#search').disabled=false}}
$('#search').onclick=search;$('#modify').onclick=()=>{let o=current.order,c=current.campaign;sessionStorage.setItem(`mask-order-phone-${o.order_no}`,currentPhone);location.href=`order.html?campaign=${encodeURIComponent(c.slug)}&lookup=${encodeURIComponent(o.order_no)}`};$('#cancel').onclick=async()=>{if(!confirm('確定取消這筆訂單？取消後仍會保留紀錄。'))return;try{await api({action:'cancel',order_no:current.order.order_no,lookup_phone:currentPhone});toast('訂單已取消。');setTimeout(search,500)}catch{toast('取消失敗，請聯絡賣家。')}};$('#clear').onclick=()=>{$('#result').classList.add('hidden');$('#orderNo').value='';$('#phone').value='';scrollTo({top:0,behavior:'smooth'})};$('#top').onclick=()=>scrollTo({top:0,behavior:'smooth'});$('#bottom').onclick=()=>document.documentElement.scrollTo({top:document.documentElement.scrollHeight,behavior:'smooth'});let q=new URLSearchParams(location.search);if(q.get('order')){$('#orderNo').value=q.get('order');let p=sessionStorage.getItem(`mask-order-phone-${q.get('order')}`);if(p){$('#phone').value=p;search()}}
document.querySelector('.top a').textContent='返回上一頁';document.querySelector('.top a').onclick=e=>{e.preventDefault();history.back()};
// v3.3.0：可用姓名＋完整電話查詢同一買家的歷史訂單，或用訂單編號＋電話查單筆。
document.head.insertAdjacentHTML('beforeend','<style>.buyer-match-list{display:grid;gap:9px}.buyer-match{display:flex;justify-content:space-between;gap:12px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:12px}.buyer-match .btn{white-space:nowrap}@media(max-width:520px){.buyer-match{align-items:flex-start;flex-direction:column}}</style>');
$('#orderNo').closest('.field').insertAdjacentHTML('beforebegin','<div class="field"><label>訂購人姓名</label><input id="buyerLookupName" autocomplete="name" placeholder="查歷史訂單時填寫"></div>');
$('#orderNo').closest('.field').querySelector('label').textContent='訂單編號（查單筆時填寫）';
document.querySelector('.form').style.gridTemplateColumns='1fr 1fr 1fr auto';
document.querySelector('.notice').textContent='請選擇一種方式：訂單編號＋完整電話查單筆，或姓名＋完整電話查詢本人歷史訂單。';
$('#result').insertAdjacentHTML('beforebegin','<section class="panel hidden" id="buyerMatches"><h3>符合的歷史訂單</h3><div class="buyer-match-list" id="buyerMatchList"></div></section>');
function renderBuyerMatches(rows){$('#buyerMatchList').innerHTML=rows.map((d,i)=>{let o=d.order,c=d.campaign,qty=(o.items||[]).reduce((n,x)=>n+Number(x.qty||0),0);return `<div class="buyer-match"><div><b>${esc(o.order_no)}｜${esc(c.name)}</b><div class="mini">${new Date(o.created_at).toLocaleString('zh-TW')}｜${names[o.status]||o.status}｜${qty} 盒</div></div><button class="btn" data-match="${i}">查看訂單</button></div>`}).join('')||'<div class="mini">找不到符合的歷史訂單</div>';$('#buyerMatches').classList.remove('hidden');document.querySelectorAll('[data-match]').forEach(b=>b.onclick=()=>{render(rows[Number(b.dataset.match)]);currentPhone=$('#phone').value.trim()})}
async function searchV330(){let no=$('#orderNo').value.trim().toUpperCase(),name=$('#buyerLookupName').value.trim(),phone=$('#phone').value.trim();if(!phone||(!no&&!name))return toast('請填寫完整電話，並輸入訂單編號或訂購人姓名。');try{$('#search').disabled=true;$('#buyerMatches').classList.add('hidden');if(no){let d=await api({action:'lookup',order_no:no,lookup_phone:phone});currentPhone=phone;render(d)}else{let d=await api({action:'lookup_buyer',name,phone});currentPhone=phone;renderBuyerMatches(d.orders||[])}}catch(e){toast(e.message==='INVALID_ORDER_ACCESS'?'訂單編號或電話不正確。':'查詢失敗，請確認姓名與電話。')}finally{$('#search').disabled=false}}
$('#search').onclick=searchV330;document.head.insertAdjacentHTML('beforeend','<style>@media(max-width:650px){.form{grid-template-columns:1fr!important}}</style>');
const lookupHomeLogo=document.querySelector('.top .logo');lookupHomeLogo.style.cursor='pointer';lookupHomeLogo.title='前往目前團購';lookupHomeLogo.onclick=async()=>{try{let d=await api({action:'active_campaign'});location.href=`order.html?campaign=${encodeURIComponent(d.slug)}`}catch{toast('目前沒有開放中的團購活動。')}};
</script></body></html>
