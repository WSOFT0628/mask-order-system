<!doctype html><html lang="zh-Hant-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>口罩訂購</title>
<style>
:root{--brand:#0f766e;--brand2:#14b8a6;--ink:#20313a;--muted:#718087;--line:#dce8e5;--bg:#f3f7f6;--danger:#be123c;--shadow:0 12px 35px rgba(25,72,67,.10)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input,textarea,select{font:inherit}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.topin{max-width:980px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:11px}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,var(--brand2),var(--brand));display:grid;place-items:center;color:#fff;font-size:21px}.top h1{font-size:17px;margin:0}.sub{font-size:11px;color:var(--muted)}.wrap{max-width:980px;margin:auto;padding:16px 14px 130px}.hero{padding:20px;border-radius:21px;background:linear-gradient(135deg,#0f766e,#115e59);color:white;box-shadow:var(--shadow)}.hero h2{margin:0 0 5px;font-size:24px}.hero p{margin:0;opacity:.85}.campaign-status{display:inline-flex;margin-top:12px;border-radius:99px;padding:5px 10px;background:rgba(255,255,255,.16);font-size:12px}.chips{display:flex;gap:7px;overflow:auto;padding:14px 0 10px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:white;border-radius:99px;padding:8px 12px;color:#506066}.chip.active{background:#d8f3ee;border-color:#a7ded5;color:#08665d;font-weight:800}.search{width:100%;border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:white;outline:none;margin:2px 0 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}.card{display:flex;flex-direction:column;gap:8px;background:white;border:1px solid var(--line);border-radius:16px;padding:13px;box-shadow:0 4px 14px rgba(25,72,67,.04)}.card.off{opacity:.58;background:#eef1f1}.head{display:flex;align-items:center;gap:9px}.swatch{width:39px;height:39px;border-radius:12px;flex:0 0 39px;border:1px solid rgba(0,0,0,.08)}.cat{font-size:11px;color:var(--brand);font-weight:750}.name{font-weight:800;line-height:1.3}.variant{color:var(--muted);font-size:12px}.price{font-weight:850;color:#0b665e}.step{margin-top:auto;display:grid;grid-template-columns:38px 1fr 38px;border:1px solid #cfe1dd;border-radius:11px;overflow:hidden;background:#f2f7f6}.step button{border:0;background:white;color:var(--brand);font-size:19px}.step input{width:100%;min-width:0;border:0;text-align:center;background:transparent;font-weight:800;-moz-appearance:textfield}.step input::-webkit-inner-spin-button{display:none}.panel{background:white;border:1px solid var(--line);border-radius:19px;padding:18px;margin-top:14px;box-shadow:0 5px 18px rgba(25,72,67,.05)}.panel h2,.panel h3{margin:0 0 12px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:white;outline:none}.full{grid-column:1/-1}.check{display:flex;gap:9px;align-items:flex-start;margin-top:12px}.check input{width:18px;height:18px;margin-top:2px}.summary{display:grid;gap:7px;margin-top:13px;padding-top:12px;border-top:1px solid var(--line)}.sum{display:flex;justify-content:space-between}.grand{font-size:19px;color:var(--brand);font-weight:850}.btn{border:0;border-radius:11px;padding:11px 15px;background:#e5f4f1;color:var(--brand);font-weight:800}.btn.primary{background:var(--brand);color:white}.btn.danger{background:#fff1f2;color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.floating{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:25;width:min(620px,calc(100% - 20px));display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:#173d39;color:white;border-radius:17px;padding:11px 13px;box-shadow:0 14px 40px rgba(0,0,0,.24)}.floating small{display:block;opacity:.72}.notice{border-radius:12px;padding:11px 13px;background:#fff7ed;color:#9a5308;margin:12px 0}.danger{background:#fff1f2;color:var(--danger)}.empty{text-align:center;color:var(--muted);padding:30px}.hidden{display:none!important}.success{text-align:center}.success-mark{width:65px;height:65px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:#d8f3ee;color:var(--brand);font-size:32px}.order-code{font:800 20px ui-monospace,monospace;background:#f2f7f6;border-radius:12px;padding:10px;margin:10px 0}.toast{position:fixed;top:72px;right:14px;z-index:100;background:#173d39;color:white;border-radius:13px;padding:12px 14px;box-shadow:var(--shadow);max-width:360px}.loading{position:fixed;inset:0;z-index:90;background:rgba(243,247,246,.88);display:grid;place-items:center;font-weight:800;color:var(--brand)}footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}
@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}.full{grid-column:auto}.hero{padding:16px}.hero h2{font-size:21px}}
@media(max-width:380px){.grid{gap:8px}.card{padding:10px}.swatch{width:32px;height:32px;flex-basis:32px}.name{font-size:13px}.step{grid-template-columns:34px 1fr 34px}}
</style></head><body>
<div class="loading" id="loading">正在讀取本次訂購資料…</div><header class="top"><div class="topin"><div class="logo">✦</div><div><h1>口罩訂購</h1><div class="sub">由 Willy 為母親設計的訂購服務</div></div></div></header>
<main class="wrap"><section id="orderPage"><div class="hero"><h2 id="campaignName">口罩訂購</h2><p id="campaignDescription"></p><span class="campaign-status" id="campaignStatus">讀取中</span></div><div id="campaignNotice" class="notice hidden"></div><div class="chips" id="chips"></div><input class="search" id="search" placeholder="搜尋商品、款式或顏色"><div class="grid" id="productGrid"></div><div class="empty hidden" id="emptyProducts">找不到符合的商品</div>
<section class="panel" id="buyerForm"><h2>訂購人資料</h2><div class="form"><div class="field"><label>姓名 *</label><input id="buyerName" autocomplete="name"></div><div class="field"><label>聯絡電話 *</label><input id="buyerPhone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>LINE 名稱（選填）</label><input id="buyerLine"></div><div class="field"><label>取貨方式（選填）</label><select id="buyerFulfillment"></select></div><div class="field full hidden" id="addressField"><label>配送地址（選填）</label><input id="buyerAddress" autocomplete="street-address"></div><div class="field full"><label>備註（選填）</label><textarea id="buyerNote" rows="3"></textarea></div><div class="field full hidden" aria-hidden="true"><label>網站</label><input id="website" tabindex="-1" autocomplete="off"></div></div><label class="check"><input id="buyerConsent" type="checkbox"><span>我同意本次訂購所需的姓名、電話及配送資料，僅供訂單確認、彙整與交貨聯絡使用。</span></label><div class="summary"><div class="sum"><span>商品數量</span><b id="sumQty">0 盒</b></div><div class="sum"><span>商品金額</span><b id="sumSubtotal">$0</b></div><div class="sum"><span>運費</span><b id="sumShipping">$0</b></div><div class="sum"><span>稅額</span><b id="sumTax">$0</b></div><div class="sum grand"><span>含稅合計</span><b id="sumTotal">$0</b></div></div><div class="actions"><button class="btn primary" id="submitOrder">確認並送出訂單</button><button class="btn danger hidden" id="cancelOrder">取消這筆訂單</button></div></section></section>
<section class="panel success hidden" id="successPage"><div class="success-mark">✓</div><h2 id="successTitle">訂單已送出</h2><p>請保存訂單編號與專屬修改連結。</p><div class="order-code" id="successOrderNo"></div><div id="successSummary"></div><div class="notice">專屬連結可查看或修改這一筆訂單，請勿轉傳給其他人。</div><div class="actions" style="justify-content:center"><button class="btn primary" id="copyOrderInfo">複製訂單資料</button><button class="btn" id="editSubmittedOrder">查看／修改訂單</button></div></section></main>
<div class="floating" id="floating"><div><small>目前訂購</small><b><span id="floatQty">0</span> 盒・<span id="floatTotal">$0</span></b></div><button class="btn primary" id="goForm">填寫資料</button></div><footer>口罩訂購助手 · 為母親所設計<br>© 2026 Willy Huang（WSOFT）</footer>
<script>
const SUPABASE_URL='https://jhyxaalondrfcybpsgdk.supabase.co',SUPABASE_KEY='sb_publishable_ssZRWVeK1ErlUpKisHgmPg_ZD7iEXzM',API=SUPABASE_URL+'/functions/v1/mask-public-order';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=n=>'$'+Math.round(Number(n)||0).toLocaleString('zh-TW');
const query=new URLSearchParams(location.search),slug=(query.get('campaign')||'').toLowerCase(),editOrder=query.get('order')||'',editToken=query.get('token')||'';let campaign=null,products=[],settings={},cart={},activeCat='全部',currentOrderNo='',currentToken='';
async function api(body){let r=await fetch(API,{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'REQUEST_FAILED');return d}
function toast(text,type=''){let n=document.createElement('div');n.className='toast '+type;n.textContent=text;document.body.appendChild(n);setTimeout(()=>n.remove(),4200)}
function swatch(p){if(p.displayColor)return p.displayColor;let s=p.variant||'';if(/粉|藕/.test(s))return'#e9a6b5';if(/紫/.test(s))return'#9b87bd';if(/藍/.test(s))return'#7ba8c9';if(/綠|青/.test(s))return'#8fb8a2';if(/黃|橘/.test(s))return'#e4b565';if(/黑|灰/.test(s))return'#7d8588';return'#b8c5c2'}
function totals(){let qty=0,sub=0;products.forEach(p=>{let q=cart[p.id]||0;qty+=q;sub+=q*p.price});let ship=qty&&qty<Number(settings.freeShippingQty||0)?Number(settings.shippingFee||0):0,tax=(sub+ship)*Number(settings.taxRate||0)/100;return{qty,sub,ship,tax,total:sub+ship+tax}}
function renderSummary(){let t=totals();$('#sumQty').textContent=t.qty+' 盒';$('#sumSubtotal').textContent=money(t.sub);$('#sumShipping').textContent=money(t.ship);$('#sumTax').textContent=money(t.tax);$('#sumTotal').textContent=money(t.total);$('#floatQty').textContent=t.qty;$('#floatTotal').textContent=money(t.total)}
function renderChips(){let cats=['全部',...new Set(products.map(p=>p.cat))];$('#chips').innerHTML=cats.map(c=>`<button class="chip ${c===activeCat?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('');$$('[data-cat]').forEach(b=>b.onclick=()=>{activeCat=b.dataset.cat;renderChips();renderProducts()})}
function renderProducts(){let q=$('#search').value.trim().toLowerCase(),rows=products.filter(p=>(activeCat==='全部'||p.cat===activeCat)&&(!q||`${p.cat}${p.name}${p.variant}`.toLowerCase().includes(q)));$('#productGrid').innerHTML=rows.map(p=>`<article class="card ${p.outOfStock?'off':''}"><div class="cat">${esc(p.cat)}</div><div class="head"><span class="swatch" style="background:${swatch(p)}"></span><div><div class="name">${esc(p.name)}</div><div class="variant">${esc(p.variant)}${p.outOfStock?'｜缺貨':''}</div></div></div><div class="price">${money(p.price)}／盒</div><div class="step"><button data-step="${p.id}" data-d="-1" ${p.outOfStock?'disabled':''}>−</button><input data-qty="${p.id}" type="number" inputmode="numeric" min="0" step="1" value="${cart[p.id]||0}" ${p.outOfStock?'disabled':''}><button data-step="${p.id}" data-d="1" ${p.outOfStock?'disabled':''}>＋</button></div></article>`).join('');$('#emptyProducts').classList.toggle('hidden',!!rows.length);$$('[data-step]').forEach(b=>b.onclick=()=>setQty(b.dataset.step,(cart[b.dataset.step]||0)+Number(b.dataset.d)));$$('[data-qty]').forEach(i=>i.onchange=()=>setQty(i.dataset.qty,i.value));renderSummary()}
function setQty(id,value){let p=products.find(x=>x.id===id),q=Math.max(0,Math.floor(Number(value)||0));if(p?.outOfStock)return;if(q)cart[id]=q;else delete cart[id];renderProducts()}
function customer(){return{name:$('#buyerName').value.trim(),phone:$('#buyerPhone').value.trim(),line_name:$('#buyerLine').value.trim(),fulfillment:$('#buyerFulfillment').value,address:$('#buyerAddress').value.trim(),note:$('#buyerNote').value.trim()}}
function lines(){return Object.entries(cart).filter(([,q])=>q>0).map(([id,qty])=>({id,qty}))}
function fillCustomer(c={}){$('#buyerName').value=c.name||'';$('#buyerPhone').value=c.phone||'';$('#buyerLine').value=c.line_name||'';$('#buyerFulfillment').value=c.fulfillment||campaign.fulfillment_options?.[0]||'';$('#buyerAddress').value=c.address||'';$('#buyerNote').value=c.note||'';toggleAddress()}
function toggleAddress(){let delivery=/宅配|配送|寄送/.test($('#buyerFulfillment').value);$('#addressField').classList.toggle('hidden',!delivery)}
async function load(){try{if(!slug)throw new Error('NO_CAMPAIGN');let d=await api({action:'campaign',slug});campaign=d.campaign;products=d.products||[];settings=d.settings||{};$('#campaignName').textContent=campaign.name;$('#campaignDescription').textContent=campaign.description||'選擇商品並填寫資料，即可送出本次訂購。';$('#campaignStatus').textContent=campaign.active?(campaign.closes_at?'收單至 '+new Date(campaign.closes_at).toLocaleString('zh-TW'):'目前開放訂購'):'目前未開放訂購';if(!campaign.active){$('#campaignNotice').textContent='本次訂購尚未開始、已截止或暫停收單。';$('#campaignNotice').classList.remove('hidden');$('#submitOrder').disabled=true}$('#buyerFulfillment').innerHTML=(campaign.fulfillment_options||[]).map(x=>`<option>${esc(x)}</option>`).join('');toggleAddress();renderChips();renderProducts();if(editOrder&&editToken)await loadExisting()}catch(e){$('#orderPage').innerHTML=`<div class="panel empty"><h2>無法開啟訂購頁</h2><p>${e.message==='NO_CAMPAIGN'?'這個網址缺少訂購活動代碼。':'訂購活動不存在或系統尚未完成 v3.0.0 設定。'}</p></div>`;$('#floating').classList.add('hidden')}finally{$('#loading').classList.add('hidden')}}
async function loadExisting(){let d=await api({action:'fetch',slug,order_no:editOrder,edit_token:editToken}),o=d.order;currentOrderNo=o.order_no;currentToken=editToken;cart={};(o.items||[]).forEach(x=>cart[x.id]=x.qty);fillCustomer(o.customer);renderProducts();$('#cancelOrder').classList.toggle('hidden',!d.campaign.allow_edit||!d.campaign.active||['cancelled','aggregated','completed'].includes(o.status));$('#submitOrder').textContent='儲存訂單修改';if(!d.campaign.allow_edit||!d.campaign.active)$('#submitOrder').disabled=true;toast(`已載入訂單 ${o.order_no}`)}
async function submit(){let t=totals(),c=customer();if(!t.qty)return toast('請至少選擇一項商品。','danger');if(!c.name||!c.phone)return toast('請填寫姓名與聯絡電話。','danger');if(!$('#buyerConsent').checked)return toast('請先同意本次訂購的個資使用說明。','danger');let btn=$('#submitOrder');try{btn.disabled=true;btn.textContent='送出中…';let body={action:currentOrderNo?'update':'submit',slug,order_no:currentOrderNo,edit_token:currentToken,customer:c,items:lines(),website:$('#website').value},d=await api(body);if(currentOrderNo){toast('訂單修改已儲存。');location.href=`order.html?campaign=${encodeURIComponent(slug)}&order=${encodeURIComponent(currentOrderNo)}&token=${encodeURIComponent(currentToken)}`;return}currentOrderNo=d.order_no;currentToken=d.edit_token;let link=`${location.origin}${location.pathname}?campaign=${encodeURIComponent(slug)}&order=${encodeURIComponent(d.order_no)}&token=${encodeURIComponent(d.edit_token)}`;localStorage.setItem(`mask-buyer-${d.order_no}`,link);showSuccess(d,link)}catch(e){let map={CAMPAIGN_CLOSED:'本次訂購已截止或暫停。',RATE_LIMITED:'送出次數過多，請稍後再試。',CUSTOMER_REQUIRED:'請完整填寫姓名與電話。',EMPTY_ORDER:'請至少選擇一項商品。',ORDER_LOCKED:'這筆訂單已鎖定，請聯絡管理員。'};toast(map[e.message]||'訂單送出失敗，請稍後再試。','danger');btn.disabled=false;btn.textContent=currentOrderNo?'儲存訂單修改':'確認並送出訂單'}}
function showSuccess(d,link){$('#orderPage').classList.add('hidden');$('#floating').classList.add('hidden');$('#successPage').classList.remove('hidden');$('#successOrderNo').textContent=d.order_no;$('#successSummary').innerHTML=`共 ${d.totalQty} 盒・含稅合計 ${money(d.total)}`;$('#copyOrderInfo').dataset.link=link;$('#editSubmittedOrder').onclick=()=>location.href=link;scrollTo({top:0,behavior:'smooth'})}
$('#copyOrderInfo').onclick=async()=>{let link=$('#copyOrderInfo').dataset.link;await navigator.clipboard.writeText(`口罩訂購完成\n訂單編號：${currentOrderNo}\n查看／修改：${link}`);toast('訂單資料已複製。')};$('#submitOrder').onclick=submit;$('#cancelOrder').onclick=async()=>{if(!confirm('確定取消這筆訂單？'))return;try{await api({action:'cancel',slug,order_no:currentOrderNo,edit_token:currentToken});toast('訂單已取消。');setTimeout(()=>location.reload(),700)}catch(e){toast('無法取消，請聯絡管理員。','danger')}};$('#buyerFulfillment').onchange=toggleAddress;$('#search').oninput=renderProducts;$('#goForm').onclick=()=>$('#buyerForm').scrollIntoView({behavior:'smooth'});load();
</script></body></html>
